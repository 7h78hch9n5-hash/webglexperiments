<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Particle Field</title>
<meta name="description" content="Forty thousand additive particles drifting through a wave field, built with three.js.">
<style>
  html, body { margin: 0; height: 100%; background: #05060a; overflow: hidden; }
  canvas { display: block; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "lil-gui": "https://cdn.jsdelivr.net/npm/lil-gui@0.20.0/dist/lil-gui.esm.min.js"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import GUI from 'lil-gui';

const params = { count: 40000, speed: 0.6, size: 0.035, spin: 0.08, hueA: 0.58, hueB: 0.92 };

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x05060a, 0.09);
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 1.4, 7);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

// soft round sprite
function spriteTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 64;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  grd.addColorStop(0, 'rgba(255,255,255,1)');
  grd.addColorStop(0.3, 'rgba(255,255,255,0.6)');
  grd.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = grd;
  g.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(c);
}

let points;
function build() {
  if (points) { scene.remove(points); points.geometry.dispose(); }
  const n = params.count;
  const pos = new Float32Array(n * 3);
  const col = new Float32Array(n * 3);
  const c = new THREE.Color();
  for (let i = 0; i < n; i++) {
    const r = 1.5 + Math.pow(Math.random(), 0.6) * 4;
    const a = Math.random() * Math.PI * 2;
    pos[i * 3] = Math.cos(a) * r;
    pos[i * 3 + 1] = (Math.random() - 0.5) * 1.6 * Math.exp(-r * 0.25);
    pos[i * 3 + 2] = Math.sin(a) * r;
    c.setHSL(THREE.MathUtils.lerp(params.hueA, params.hueB, (r - 1.5) / 4), 0.8, 0.6);
    col.set([c.r, c.g, c.b], i * 3);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  geo.userData.base = pos.slice();
  points = new THREE.Points(geo, new THREE.PointsMaterial({
    size: params.size, map: spriteTexture(), vertexColors: true,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  }));
  scene.add(points);
}
build();

const gui = new GUI({ title: 'particles' });
gui.add(params, 'count', 5000, 100000, 1000).onFinishChange(build);
gui.add(params, 'speed', 0, 2);
gui.add(params, 'size', 0.005, 0.1).onChange(v => (points.material.size = v));
gui.add(params, 'spin', 0, 0.5);
gui.add(params, 'hueA', 0, 1).onFinishChange(build);
gui.add(params, 'hueB', 0, 1).onFinishChange(build);

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const t = clock.getElapsedTime() * params.speed;
  const p = points.geometry.attributes.position;
  const base = points.geometry.userData.base;
  for (let i = 0; i < p.count; i++) {
    const x = base[i * 3], y = base[i * 3 + 1], z = base[i * 3 + 2];
    p.array[i * 3 + 1] = y + Math.sin(x * 1.3 + t) * 0.25 + Math.cos(z * 1.1 + t * 0.7) * 0.25;
  }
  p.needsUpdate = true;
  points.rotation.y = clock.getElapsedTime() * params.spin;
  controls.update();
  renderer.render(scene, camera);
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
